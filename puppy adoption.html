<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>Puppy Adoption Page</h1>
  <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
  <p>Please Note: First Name, Last Name, Password, and Email are required</p>

    <form action="puppy adoption.html" method="post">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>
    
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>
        <br></br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <p>Are you over the age of 18?</p>
        <label for="eighteen-yes">Yes:</label>
        <input type="radio" id="eighteen-yes" name="eighteen" value="yes">
        <label for="eighteen-no">No:</label>
        <input type="radio" id="eighteen-no" name="eighteen" value="no">
    
        <p>Do you have Credit Card or PayPal?</p>
        <select id="Credit Card" name="payment" value="credit-card">
        <option value="credit-card">Credit Card</option>   
        <option value="paypal">PayPal</option>
        </select>
        <br></br>
        <input type="submit" value="Submit Feedback">
    </form>
    </body>
